name: GrumPHP

on: [push, pull_request]
permissions:
  contents: read

jobs:
    run:
        runs-on: ${{ matrix.operating-system }}
        strategy:
            matrix:
                operating-system: [ubuntu-latest, macos-latest]
                php-versions: ['8.3', '8.4', '8.5', '8.6']
                composer-deps: ['highest', 'lowest']
                composer-versions: ['composer:v2']
            fail-fast: false
        name: PHP ${{ matrix.php-versions }} @ ${{ matrix.operating-system }} with ${{ matrix.composer-versions }} ${{ matrix.composer-deps }}
        steps:
            - name: Checkout
              uses: actions/checkout@master
            - name: Install PHP
              uses: shivammathur/setup-php@master
              with:
                  php-version: ${{ matrix.php-versions }}
                  tools: ${{ matrix.composer-versions }}
                  extensions: xdebug, mbstring, posix, pcov, intl
            - name: Check Versions
              run: |
                php -v
                php -m
                composer --version
            - name: Install dependencies (highest)
              if: matrix.composer-deps == 'highest'
              run: composer update --prefer-dist --no-progress --no-suggest
            - name: Install dependencies (lowest)
              if: matrix.composer-deps == 'lowest'
              # Psalm 7 allows amphp versions that are too old to boot on PHP 8.4+, so its own tree stays on highest.
              run: |
                composer update --prefer-dist --no-progress --no-suggest --prefer-lowest
                composer update --prefer-dist --no-progress --no-suggest vimeo/psalm --with-all-dependencies
            - name: Set git variables
              run: |
                git config --global user.email "you@example.com"
                git config --global user.name "Your Name"
                git config --global protocol.file.allow always
            - name: Run the tests
              run: php vendor/bin/grumphp run --no-interaction
              env:
                PHP_CS_FIXER_IGNORE_ENV: 1
